name: Watch live match

# Long-running live watcher for one match. Triggered by the website's
# "Watch live" button. Runs live_watch.py on the self-hosted runner: cheap
# 30s polls + full crawls on goals / every 2 min, until full-time.
on:
  workflow_dispatch:
    inputs:
      match:
        # Vestigial: the job always runs in --daemon mode and follows every
        # match flagged watch=true in the DB, so it never reads this input.
        # Must stay optional — the kickoff cron dispatches with only {ref},
        # and a required input here makes GitHub reject that with HTTP 422
        # ("Required input 'match' not provided"), so no watcher ever starts.
        description: "Match URL to watch live (unused; daemon follows the DB watch list)"
        required: false
        type: string
      run_id:
        description: "crawl_runs id to update (set by the website)"
        required: false
        type: string

# One live watch at a time. A redundant dispatch (e.g. a stray "Watch live"
# click while a match is already being watched) queues behind the running
# watcher instead of cancelling it — the daemon already re-reads the DB watch
# list every ~30s and absorbs newly-flagged matches on its own, so there is
# never a need to kill an in-progress watch to pick up new work.
concurrency:
  group: watch-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: self-hosted
    timeout-minutes: 210
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Watch live (all flagged matches)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IN_RUN_ID: ${{ github.event.inputs.run_id }}
        run: python live_watch.py --daemon
