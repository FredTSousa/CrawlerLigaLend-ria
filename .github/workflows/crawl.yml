name: Crawl & sync

# Runs the zerozero crawler and upserts into Supabase.
#  - on a 6-hour schedule (trigger = schedule, crawls the current round)
#  - on demand from the website / manually (trigger = manual, with inputs)
on:
  schedule:
    - cron: "0 */6 * * *"          # every 6 hours (UTC)
  workflow_dispatch:
    inputs:
      jornada:
        description: "Round number to crawl (blank = current round)"
        required: false
        type: string
      match:
        description: "Single match URL (overrides jornada)"
        required: false
        type: string
      run_id:
        description: "Existing crawl_runs id to update (set by the website)"
        required: false
        type: string

# Never let two crawls run at once.
concurrency:
  group: crawl-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl & sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVENT: ${{ github.event_name }}
          IN_JORNADA: ${{ github.event.inputs.jornada }}
          IN_MATCH: ${{ github.event.inputs.match }}
          IN_RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          set -e
          if [ "$EVENT" = "schedule" ]; then
            python sync.py --trigger schedule
          elif [ -n "$IN_MATCH" ]; then
            python sync.py --trigger manual --match "$IN_MATCH" ${IN_RUN_ID:+--run-id "$IN_RUN_ID"}
          else
            python sync.py --trigger manual ${IN_JORNADA:+--jornada "$IN_JORNADA"} ${IN_RUN_ID:+--run-id "$IN_RUN_ID"}
          fi
