name: Crawl & sync

# Runs the zerozero crawler and upserts into Supabase.
#  - on a 6-hour schedule (trigger = schedule): sweeps every active competition
#    and crawls only the rounds that need an update (sync.py --scheduled). A
#    league whose current round is fully scheduled in the future with known
#    kickoff times is skipped; a finished season is deactivated and skipped from
#    then on. See sync.run_scheduled / migration_crawl_active.sql.
#  - on demand from the website / manually (trigger = manual, with inputs)
on:
  schedule:
    - cron: "0 */6 * * *"          # every 6 hours (UTC)
  workflow_dispatch:
    inputs:
      jornada:
        description: "Round number to crawl (blank = current round)"
        required: false
        type: string
      match:
        description: "Single match URL (overrides jornada)"
        required: false
        type: string
      competition:
        description: "Competition slug or URL (blank = Liga Portugal)"
        required: false
        type: string
      backfill:
        description: "Crawl every not-yet-complete round of the competition"
        required: false
        type: boolean
        default: false
      force:
        description: "With backfill, re-crawl rounds even if already final"
        required: false
        type: boolean
        default: false
      run_id:
        description: "Existing crawl_runs id to update (set by the website)"
        required: false
        type: string

# Never let two crawls run at once.
concurrency:
  group: crawl-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    # Runs on a self-hosted runner on the user's machine (residential IP),
    # because zerozero.pt blocks GitHub-hosted datacenter IPs.
    runs-on: self-hosted
    # Use cmd, not PowerShell: a Restricted PS execution policy on the runner
    # blocks the per-step temp .ps1 scripts. cmd has no such restriction.
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Crawl & sync
        # No shell conditionals (self-hosted Windows defaults to PowerShell):
        # sync.py reads the inputs below from the environment.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          JOB_KIND: League matches
          IN_JORNADA: ${{ github.event.inputs.jornada }}
          IN_MATCH: ${{ github.event.inputs.match }}
          IN_COMPETITION: ${{ github.event.inputs.competition }}
          IN_BACKFILL: ${{ github.event.inputs.backfill }}
          IN_FORCE: ${{ github.event.inputs.force }}
          IN_RUN_ID: ${{ github.event.inputs.run_id }}
        run: python sync.py
