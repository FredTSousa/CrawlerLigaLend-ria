name: Sync competition squads

# Runs the zerozero roster crawler (roster_sync.py) and upserts teams/players
# into Supabase. Triggered on demand from the backoffice (POST /api/crawl with
# kind teams|roster|players|comp_full) or manually. Mirrors crawl.yml.
on:
  workflow_dispatch:
    inputs:
      competition:
        description: "Competition slug or URL (blank = Liga Portugal)"
        required: false
        type: string
      full:
        description: "Full sync: also open every player detail page"
        required: false
        type: boolean
        default: false
      players_only:
        description: "Re-fetch Transfermarkt positions over existing DB rosters (no zerozero squad crawl)"
        required: false
        type: boolean
        default: false
      force:
        description: "With full, re-enrich even freshly-updated players"
        required: false
        type: boolean
        default: false
      team:
        description: "Refresh only this team id's roster"
        required: false
        type: string
      player:
        description: "Enrich only this player id"
        required: false
        type: string
      run_id:
        description: "Existing crawl_runs id to update (set by the website)"
        required: false
        type: string

# Per-competition concurrency: different leagues sync in parallel, but a league
# never overlaps itself. Falls back to a shared group when no competition input.
concurrency:
  group: squads-${{ github.event.inputs.competition || 'default' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  squads:
    # Self-hosted residential runner (zerozero blocks datacenter IPs).
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Crawl & sync squads
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          JOB_KIND: Squads
          IN_COMPETITION: ${{ github.event.inputs.competition }}
          IN_FULL: ${{ github.event.inputs.full }}
          IN_PLAYERS_ONLY: ${{ github.event.inputs.players_only }}
          IN_FORCE: ${{ github.event.inputs.force }}
          IN_TEAM: ${{ github.event.inputs.team }}
          IN_PLAYER: ${{ github.event.inputs.player }}
          IN_RUN_ID: ${{ github.event.inputs.run_id }}
        run: python roster_sync.py
